services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/data
    restart: unless-stopped

  mock-postgres:
    image: postgres:15-alpine
    container_name: mock-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8081:8000"
    volumes:
      - .:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MOCK_DATABASE_URL=postgresql://postgres:postgres@mock-postgres:5432/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      mock-postgres:
        condition: service_healthy
    restart: unless-stopped

  agent-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-parser
    command: faststream run parser_agent.main:app
    volumes:
      - .:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LLM_PROVIDER=${LLM_PROVIDER}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE}
      - GIGACHAT_BASE_URL=${GIGACHAT_BASE_URL}
      - GIGACHAT_VERIFY_SSL_CERTS=${GIGACHAT_VERIFY_SSL_CERTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  agent-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-rag
    command: faststream run rag_agent.main:app
    volumes:
      - .:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  agent-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-executor
    command: faststream run executor_agent.main:app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MOCK_DATABASE_URL=postgresql://postgres:postgres@mock-postgres:5432/postgres
      - LLM_PROVIDER=${LLM_PROVIDER}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE}
      - GIGACHAT_BASE_URL=${GIGACHAT_BASE_URL}
      - GIGACHAT_VERIFY_SSL_CERTS=${GIGACHAT_VERIFY_SSL_CERTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma-data:
