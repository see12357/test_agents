platform:
  llm_provider: "deepseek"
  embedding_model: "intfloat/multilingual-e5-large"
  retry_delay_seconds: 2
  execution_timeout_seconds: 15
  chroma_collection_name: "db_manuals"
  rag_fallback_mapping:
    pgbouncer_setup.md: ["bouncer", "pgbouncer", "пул", "pool"]
    schema_migration.md: ["миграци", "схем", "concurrently", "индекс"]
    backup_restore.md: ["бэкап", "резервн", "patroni", "dump"]
    cert_update.md: ["ssl", "tls", "сертификат"]
    compliance.md: ["аудит", "безопасн", "compliance"]
    os_update.md: ["os", "пакет", "обновлени", "apt", "apk", "bouncer", "pgbouncer", "пул", "pool"]
  
validation:
  allowed_objects:
    - "pg-billing-prod"
    - "pg-crm-prod"
    - "pg-auth-stage"
    - "pg-analytics-test"
    - "pg-warehouse-prod"
    - "pg-orders-prod"
    - "pg-users-stage"
  allowed_object_types:
    - "patroni_cluster"
    - "postgres_standalone"
    - "pgbouncer"
    - "redis_sentinel"
    - "mongodb_replica"
  allowed_priorities:
    - "low"
    - "medium"
    - "high"
    - "critical"
  allowed_actions:
    - "os_upgrade"
    - "ssl_renew"
    - "compliance_audit"
    - "backup_restore"
    - "schema_migration"

pipeline:
  # Декларативное описание конвейера агентов и маршрутизации очередей.
  # Для добавления нового агента: добавьте новый шаг с указанием входной и выходной очередей.
  steps:
    - name: parser
      description: "Парсинг и валидация входящей заявки"
      subscribe_queue: "q.tasks.raw"
      publish_queue: "q.tasks.parsed"
      enabled: true
    - name: rag
      description: "Обогащение задачи контекстом из базы знаний"
      subscribe_queue: "q.tasks.parsed"
      publish_queue: "q.tasks.ready_for_execution"
      enabled: true
    - name: executor
      description: "Генерация, тестирование и исполнение скриптов"
      subscribe_queue: "q.tasks.ready_for_execution"
      publish_queue: "q.tasks.human_approval"
      approval_queue: "q.tasks.execute_prod"
      enabled: true

tracing:
  # LLM Observability & трассировка всех вызовов LangChain/LangGraph
  provider: "langfuse"
  enabled: true
  # Настройки для self-hosted Langfuse (переменные окружения):
  #   LANGFUSE_SECRET_KEY  — секретный ключ проекта
  #   LANGFUSE_PUBLIC_KEY  — публичный ключ проекта
  #   LANGFUSE_BASE_URL    — URL Langfuse API (по умолчанию http://langfuse-web:3000)
  # При отсутствии переменных tracing автоматически отключается,
  # агенты продолжают работу в обычном режиме.

agents:
  parser:
    prompt: |
      Convert the input database administration (DBA) request into a strictly valid JSON object matching the required schema:
      {
        "priority": "low" | "medium" | "high" | "critical",
        "action_type": "os_upgrade" | "ssl_renew" | "compliance_audit" | "backup_restore" | "schema_migration",
        "object": "<target_object_id>",
        "object_type": "patroni_cluster" | "postgres_standalone" | "pgbouncer" | "redis_sentinel" | "mongodb_replica",
        "purpose": "<summary_purpose_statement>",
        "subtasks": [
          {"order": 1, "action": "<step_description>", "constraints": ["<constraint_1>"]}
        ],
        "sla_minutes": <number>,
        "is_downtime": true | false
      }

      Allowed target objects: pg-billing-prod, pg-crm-prod, pg-auth-stage, pg-analytics-test, pg-warehouse-prod, pg-orders-prod, pg-users-stage.

      ACTION TYPE CLASSIFICATION RULES:
      - "compliance_audit": STRICTLY READ-ONLY inspection, user access audit, privilege checks, log monitoring. NEVER classify parameter changes, configuration updates, or pgbouncer modifications as compliance_audit!
      - "os_upgrade": For OS package updates, PgBouncer configuration/parameter changes (e.g. max_client_conn, default_pool_size, pgbouncer.ini), service restarts, and server maintenance.

      Output ONLY valid JSON and nothing else.

  rag:
    chunk_size: 1000
    chunk_overlap: 200
    initial_candidates: 5
    reranker_enabled: true
    reranker_top_k: 2
    reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    prompt: |
      You are a Senior DBA Knowledge Base Retrieval Agent.
      Formulate optimal search queries based on target database topology, operation type, and safety constraints to retrieve authoritative operational manuals, safety guidelines, and recovery procedures from ChromaDB.

  executor:
    max_retries: 3
    prompt: |
      You are an expert Principal Database Reliability Engineer (DBA).
      Based on the structured task specification and retrieved RAG documentation guidelines,
      generate a fully executable, self-contained Bash (/bin/sh) or SQL script to perform the requested maintenance.

      CRITICAL PARAMETER OVERRIDE RULE:
      - RAG manuals contain generic reference code and template defaults (e.g. max_client_conn = 500, lock_timeout = 5s).
      - YOU MUST ALWAYS OVERRIDE REFERENCE/TEMPLATE VALUES IN RAG MANUALS WITH THE EXACT NUMERIC VALUES, TIMEOUTS, SETTINGS, AND PARAMETERS SPECIFIED IN THE USER'S TASK REQUEST (e.g. if the user request specifies max_client_conn = 1000, write max_client_conn = 1000, DO NOT copy example numbers from RAG manuals!).

      NON-INTERACTIVE AUTOMATION RULE:
      - Generated scripts execute non-interactively in batch mode. NEVER write interactive commands like `read` or `read -p`. Write explicit non-interactive code where parameters (e.g. `max_client_conn = 1000`) are written directly into configuration files (e.g. `/etc/pgbouncer/pgbouncer.ini`) or CLI commands.

      Ensure all directories (such as /etc/pgbouncer) are safely created using `mkdir -p` before creating configuration files.
      Return ONLY the code block enclosed in markdown ```bash or ```sql format.

    rules:
      common:
        - "- When connecting to PostgreSQL always specify default connection variables with fallback to mock-postgres: DB_HOST=\"${DB_HOST:-mock-postgres}\", DB_PORT=\"${DB_PORT:-5432}\", DB_USER=\"${DB_USER:-postgres}\", DB_NAME=\"${DB_NAME:-postgres}\". Never leave empty connection parameters in psql or pg_dump commands."
        - "- GENERAL SANDBOX RULE: Testing container is an Alpine Linux container. NEVER write `exit 1` or terminate execution when optional binaries (pgbouncer, patronictl, ssh, apt-get) are not installed or when checking locks/files. Always use graceful fallback syntax: `(cmd || echo 'step skipped')` so the script returns exit code 0."
        - "- FILE SYSTEM RULES: Always write temporary logs and dumps inside `/tmp/` directory (e.g. `/tmp/execution.log`, `/tmp/backup.sql`). DO NOT write files directly to root `/` directory or attempt `mv /file.txt`."
        - "- IDEMPOTENT SCHEMA ALTERATIONS: ALL `ALTER TABLE ... ADD COLUMN` statements MUST use `IF NOT EXISTS` (e.g., `ALTER TABLE users ADD COLUMN IF NOT EXISTS new_column TEXT;`). NEVER write `ADD COLUMN` without `IF NOT EXISTS`!"
      sql:
        - "- Script must contain ONLY valid SQL statements. Before executing DDL operations, always set lock timeout: SET lock_timeout = '5s';"
      sh:
        - "- Script must be strictly POSIX-compliant /bin/sh shell code. DO NOT use bash-specific features such as 'exec > >(tee ...)', '[[ ]]', 'date -d', 'date -D', or 'function name()'. For log redirection use standard POSIX syntax: 'exec >> \"$LOG_FILE\" 2>&1'."
      patroni_cluster:
        - "- ATTENTION: Target object involves a Patroni cluster. In container sandbox testing environments, CLI binaries `patronictl`, `ssh`, or `apt-get` may NOT be installed."
        - "- STRICT REQUIREMENT: Always wrap binary calls with conditional checks (`which patronictl >/dev/null 2>&1 && patronictl ... || echo 'patronictl check skipped'`)."
        - "- STRICTLY FORBIDDEN: DO NOT write `exit 1` or fail if `patronictl`, `ssh`, or `apt-get` is missing!"
        - "- For lock checks in bash, use standard `pg_stat_activity`: `psql -h \"$DB_HOST\" -U \"$DB_USER\" -d \"$DB_NAME\" -c \"SELECT count(*) FROM pg_stat_activity WHERE state = 'active';\"`. DO NOT query non-existent columns like `locked_transaction`."
      pgbouncer:
        - "- ATTENTION: Target object is PgBouncer."
        - "- MANDATORY CONFIGURATION RULE: You MUST generate bash commands that create/update `/etc/pgbouncer/pgbouncer.ini` using `mkdir -p /etc/pgbouncer` and `cat << 'EOF' > /etc/pgbouncer/pgbouncer.ini` containing exact numeric parameters requested by the user (e.g. `max_client_conn = 1000`)."
        - "- Ensure pgbouncer binary is checked (`which pgbouncer >/dev/null 2>&1 || apk add --no-cache pgbouncer 2>/dev/null || true`)."
        - "- For reload use `which pgbouncer >/dev/null 2>&1 && pgbouncer -R -d /etc/pgbouncer/pgbouncer.ini 2>/dev/null || echo 'PgBouncer reload completed'`."
        - "- DO NOT write OS package update templates or dummy comments instead of updating /etc/pgbouncer/pgbouncer.ini!"
      ssl_renew:
        - "- MANDATORY FOR SSL_RENEW: The script MUST begin with package installation check: `which openssl >/dev/null 2>&1 || apk add --no-cache openssl 2>/dev/null || true`."
        - "- MANDATORY: Check and generate certificates if missing: `if [ ! -f /tmp/server.crt ]; then openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/server.key -out /tmp/server.crt -days 365 -subj \"/CN=postgres\" 2>/dev/null || true; fi`."
        - "- MANDATORY: Copy certificates and set permissions: `cp /tmp/server.crt /var/lib/postgresql/data/server.crt 2>/dev/null || true; cp /tmp/server.key /var/lib/postgresql/data/server.key 2>/dev/null || true; chmod 600 /var/lib/postgresql/data/server.key 2>/dev/null || true`."
        - "- MANDATORY: Reload configuration via SQL ONLY: `psql -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\" -c \"SELECT pg_reload_conf();\"`."
        - "- MANDATORY: Check SSL settings: `psql -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\" -c \"SELECT name, setting FROM pg_settings WHERE name LIKE 'ssl%';\"`."
        - "- CRITICAL: DO NOT use pg_ctl, su, systemctl, or service commands."
      backup_restore:
        - "- MANDATORY FOR BACKUP: Perform database backup using `pg_dump`: `mkdir -p /tmp/backup && pg_dump -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\" > /tmp/backup/backup.sql || true`."
        - "- If physical backup with `pg_basebackup` is attempted, ALWAYS wrap it with fallback to `pg_dump`: `(pg_basebackup -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -D /tmp/basebackup 2>/dev/null || pg_dump -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\" > /tmp/backup/backup.sql || true)`."
        - "- For lock checks, use `SELECT count(*) FROM pg_stat_activity WHERE state = 'active'`. DO NOT query non-existent columns like `locked_transaction` or `locked_by`."
      os_upgrade:
        - "- ABSOLUTE POSIX REQUIREMENT FOR OS_UPGRADE:"
        - "- Use simple single brackets `[ ... ]` for shell conditionals. NEVER use `[[ ... ]]` or complex bash syntax."
        - "- Package update commands MUST be wrapped safely: `(which apk >/dev/null 2>&1 && apk update 2>/dev/null || true)` and `(which apt-get >/dev/null 2>&1 && apt-get update 2>/dev/null || true)`."
        - "- For lock checks, use simple psql command: `psql -h \"${DB_HOST:-mock-postgres}\" -U postgres -d postgres -c \"SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active';\" || true`."
        - "- NEVER write `exit 1` or terminate execution when checking lock or package manager status."
      schema_migration:
        - "- ABSOLUTE STRICT REQUIREMENT FOR SCHEMA_MIGRATION:"
        - "- Target database table is strictly `users` (do not confuse server name `pg-orders-prod` or `pg-analytics-test` with table name)."
        - "- IDEMPOTENT DDL RULE: Use native PostgreSQL 9.6+ syntax: `ALTER TABLE users ADD COLUMN IF NOT EXISTS new_column text;` and `CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_name ON users(...);`."
        - "- HEREDOC ESCAPING RULE: ALWAYS quote heredoc delimiters `<< 'EOF'` (with single quotes around EOF) when passing SQL to `psql` to prevent shell expansion of `$$` or variables!"
        - "- DO NOT use PL/pgSQL `DO $$` blocks or complex control structures when standard DDL statements (`ALTER TABLE ... ADD COLUMN IF NOT EXISTS`) exist."
        - "- Start directly with `SET lock_timeout = '5s';`."
      downtime:
        - "- CRITICAL: Service downtime is planned. Minimize the number of commands and execution duration."
      critical_priority:
        - "- HIGH PRIORITY TASK: Ensure database backups are verified before executing operations."
